name: Murmur models

on:
  push:
    branches: [main]
    paths:
      - "crates/murmur-core/**"
      - "apps/murmur/scripts/download-models.sh"
      - "rust-toolchain.toml"
      - ".github/workflows/murmur-models.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: murmur-models
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MODELS_DIR: ~/Library/Application Support/Murmur/models

jobs:
  end-to-end:
    name: Real models end to end (macOS, CPU)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/Library/Caches/sherpa-rs
            target
          key: cargo-mac-v3-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-mac-v3-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MODELS_DIR }}
          key: murmur-models-v1-${{ hashFiles('apps/murmur/scripts/download-models.sh') }}
      - if: steps.models.outputs.cache-hit != 'true'
        run: apps/murmur/scripts/download-models.sh
      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MODELS_DIR }}
          key: ${{ steps.models.outputs.cache-primary-key }}
      - name: Run the end-to-end test
        timeout-minutes: 40
        run: |
          data="$RUNNER_TEMP/murmur-data"
          mkdir -p "$data"
          ln -s "$HOME/Library/Application Support/Murmur/models" "$data/models"
          MURMUR_DATA_DIR="$data" MURMUR_GPU_LAYERS=0 cargo test -p murmur-core --release --locked \
            --target aarch64-apple-darwin --test real_models -- --ignored --nocapture
