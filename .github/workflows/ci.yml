name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Decides which jobs this push or pull request needs, from the files it changes.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.filter.outputs.js }}
      pkmn: ${{ steps.filter.outputs.pkmn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Without a usable base (a new branch, or history that is gone), run everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "js=true" >> "$GITHUB_OUTPUT"
            echo "pkmn=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...HEAD")
          printf 'Changed files:\n%s\n' "$changed"
          # Oxfmt and Oxlint cover the whole repository, so only Rust and Swift sources and
          # the Cargo lockfile leave the JavaScript checks alone.
          if printf '%s\n' "$changed" | grep -qvE '\.(rs|swift)$|^Cargo\.lock$'; then
            echo "js=true" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(crates/pkmn/|apps/pkmn-oracle/|Cargo\.(toml|lock)$|rustfmt\.toml$|clippy\.toml$|pnpm-(lock|workspace)\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "pkmn=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Format, lint, typecheck, test, and knip
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `turbo --affected` compares against the base branch, so it needs the history.
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-check-${{ runner.os }}-
      # `pnpm check`, with the typecheck limited to packages the change affects.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm turbo typecheck --affected
      - run: pnpm test
      - run: pnpm knip

  rust:
    name: pkmn (format, clippy, test)
    needs: changes
    if: needs.changes.outputs.pkmn == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy -p pkmn --all-targets --locked -- -D warnings
      # The differential test replays battles recorded from Pokémon Showdown.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @workspace/pkmn-oracle
      - run: pnpm --filter @workspace/pkmn-oracle generate
      - run: cargo test -p pkmn --locked
        env:
          PKMN_REQUIRE_SHOWDOWN: 1

  build:
    name: Production build
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbopack's build cache lives in .next/cache; keyed by the lockfile so dependency
      # upgrades start fresh, then restored from the closest earlier commit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Builds only the packages the change affects, and what they depend on.
      - run: pnpm turbo build --affected
