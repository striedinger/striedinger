name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Format, lint, typecheck, test, and knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-check-${{ runner.os }}-
      - run: pnpm check

  rust:
    name: pkmn (format, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy -p pkmn --all-targets --locked -- -D warnings
      - run: cargo test -p pkmn --locked

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbopack's build cache lives in .next/cache; keyed by the lockfile so dependency
      # upgrades start fresh, then restored from the closest earlier commit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    env:
      # Keep cached artifacts small and lint/test build profiles consistent.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select affected Rust packages
        id: affected
        run: |
          python3 .github/scripts/test-rust-affected.py
          python3 .github/scripts/rust-affected.py
      - name: No affected Rust packages
        if: steps.affected.outputs.run != 'true'
        run: echo "No affected Pokémon crates; Rust checks are not needed."
      - if: steps.affected.outputs.run == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # Fail formatting before downloading/restoring build dependencies.
      - if: steps.affected.outputs.run == 'true'
        run: cargo +stable fmt ${{ steps.affected.outputs.packages }} -- --check
      - name: Identify Rust compiler
        if: steps.affected.outputs.run == 'true'
        id: rustc
        run: echo "hash=$(rustc +stable -vV | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust dependencies and build artifacts
        if: steps.affected.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          # A per-commit key saves updated artifacts; prefixes reuse earlier builds.
          # Bump v1 if build-profile settings above change.
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.hash }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.hash }}-${{ hashFiles('Cargo.lock') }}-
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.hash }}-
      - if: steps.affected.outputs.run == 'true'
        run: cargo +stable clippy ${{ steps.affected.outputs.packages }} --all-targets --locked -- -D warnings
      - if: steps.affected.outputs.run == 'true'
        run: cargo +stable test ${{ steps.affected.outputs.packages }} --locked
