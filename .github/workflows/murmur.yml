name: Murmur

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "crates/**"
      - "apps/murmur/**"
      - ".github/workflows/murmur.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "crates/**"
      - "apps/murmur/**"
      - ".github/workflows/murmur.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: murmur-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core:
    name: Rust core (format, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ALSA headers for cpal, and clang for the llama.cpp bindings. CMake is preinstalled.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libclang-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/sherpa-rs
            target
          # sherpa-rs downloads onnxruntime into its own cache, outside target/. Caching
          # target/ without it leaves build scripts pointing at libraries that aren't there.
          key: cargo-core-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-core-v2-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy -p murmur-core -p murmur-bindgen --all-targets --locked -- -D warnings
      - run: cargo test -p murmur-core --locked

  mac:
    name: macOS app (build and bundle)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/Library/Caches/sherpa-rs
            target
          # See the core job: sherpa-rs's download cache must travel with target/.
          key: cargo-mac-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-mac-v2-${{ runner.os }}-
      # Compiles the Rust core with Metal, generates the Swift bindings, compiles the
      # Swift shell, and assembles an ad-hoc signed Murmur.app. Models aren't needed to build.
      - run: apps/murmur/scripts/build-mac.sh
      - name: Check the bundle
        run: |
          app=apps/murmur/build/Murmur.app
          test -x "$app/Contents/MacOS/Murmur"
          codesign --verify --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          for lproj in "$app"/Contents/Resources/*.lproj; do plutil -lint "$lproj"/*.strings; done
          # Every bundled dylib must resolve through @rpath, not a path on the build machine.
          ! otool -L "$app"/Contents/Frameworks/*.dylib "$app/Contents/MacOS/Murmur" \
            | grep -E '^\s+/(Users|opt|private|var)/'


  # Cross-building from Linux with xtool needs Apple's Darwin SDK. Rather than storing
  # the SDK anywhere, a macOS runner (Apple hardware with Xcode preinstalled) builds it
  # fresh each run and hands it to the Linux job as a short-lived artifact, which the
  # cleanup job deletes once the run ends. Push and manual runs only, never pull requests,
  # so forks can't trigger the SDK build or get at the artifact.
  darwin-sdk:
    name: Darwin SDK from the runner's Xcode (xtool)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    outputs:
      swift-version: ${{ steps.xcode.outputs.swift-version }}
    steps:
      - name: Find Xcode and its Swift version
        id: xcode
        run: |
          xcode="$(dirname "$(dirname "$(xcode-select -p)")")"
          swift_version="$(xcrun swift --version 2>&1 | sed -nE 's/.*Apple Swift version ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p')"
          echo "Xcode: $xcode, Swift $swift_version"
          echo "path=$xcode" >> "$GITHUB_OUTPUT"
          echo "swift-version=$swift_version" >> "$GITHUB_OUTPUT"
      - run: brew install xtool-org/tap/xtool
      # x86_64: the Linux runner's architecture. The SDK includes the macOS sysroot and an
      # ld64-compatible toolset that run on that Linux host.
      - run: xtool sdk build "${{ steps.xcode.outputs.path }}" "$RUNNER_TEMP/sdk" --arch x86_64
      - run: tar --zstd -cf "$RUNNER_TEMP/darwin.xtoolsdk.tar.zst" -C "$RUNNER_TEMP/sdk" darwin.xtoolsdk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-sdk
          path: ${{ runner.temp }}/darwin.xtoolsdk.tar.zst
          retention-days: 1
          compression-level: 0

  linux-cross:
    name: macOS app cross-built on Linux (xtool)
    needs: darwin-sdk
    runs-on: ubuntu-latest
    # The SDK's Swift modules come from the runner's Xcode, so the Linux compiler must be
    # the same Swift version.
    container: swift:${{ needs.darwin-sdk.outputs.swift-version }}-noble
    env:
      RCODESIGN_VERSION: "0.29.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git zstd cmake make llvm libclang-dev
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --target aarch64-apple-darwin
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/xtool-org/xtool/releases/latest/download/xtool-x86_64.AppImage" -o /usr/local/bin/xtool
          chmod +x /usr/local/bin/xtool
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin --wildcards '*/rcodesign'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-sdk
          path: /tmp
      - name: Install the Darwin SDK
        env:
          # AppImages need FUSE, which containers lack; extract and run instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          tar --zstd -xf /tmp/darwin.xtoolsdk.tar.zst -C /tmp
          xtool sdk install /tmp/darwin.xtoolsdk
          swift sdk list
      - name: Build Murmur.app
        run: apps/murmur/scripts/build-mac.sh
      - name: Check the bundle
        run: |
          app=apps/murmur/build/Murmur.app
          test -f "$app/Contents/MacOS/Murmur"
          rcodesign verify "$app/Contents/MacOS/Murmur"
          "$(ls /usr/bin/llvm-otool* | head -n 1)" -L "$app/Contents/MacOS/Murmur"

  delete-darwin-sdk:
    name: Delete the SDK artifact
    needs: [darwin-sdk, linux-cross]
    if: always() && needs.darwin-sdk.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "darwin-sdk") | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
