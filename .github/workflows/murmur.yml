name: Murmur

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "crates/**"
      - "apps/murmur/**"
      - ".github/workflows/murmur.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "crates/**"
      - "apps/murmur/**"
      - ".github/workflows/murmur.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: murmur-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core:
    name: Rust core (format, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ALSA headers for cpal, and clang for the llama.cpp bindings. CMake is preinstalled.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libclang-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-core-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-core-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy -p murmur-core --all-targets --locked -- -D warnings
      - run: cargo test -p murmur-core --locked

  mac:
    name: macOS app (build and bundle)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-mac-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-mac-${{ runner.os }}-
      # Compiles the Rust core with Metal, generates the Swift bindings, compiles the
      # Swift shell, and assembles an ad-hoc signed Murmur.app. Models aren't needed to build.
      - run: apps/murmur/scripts/build-mac.sh
      - name: Check the bundle
        run: |
          app=apps/murmur/build/Murmur.app
          test -x "$app/Contents/MacOS/Murmur"
          codesign --verify --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          for lproj in "$app"/Contents/Resources/*.lproj; do plutil -lint "$lproj"/*.strings; done
          # Every bundled dylib must resolve through @rpath, not a path on the build machine.
          ! otool -L "$app"/Contents/Frameworks/*.dylib "$app/Contents/MacOS/Murmur" \
            | grep -E '^\s+/(Users|opt|private|var)/'
