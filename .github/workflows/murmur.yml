name: Murmur

on:
  push:
    branches: [main]
    paths: &murmur-paths
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "crates/murmur-core/**"
      - "crates/murmur-bindgen/**"
      - "apps/murmur/**"
      - ".github/workflows/murmur.yml"
  pull_request:
    paths: *murmur-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: murmur-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  core:
    name: Rust core (format, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt -p murmur-core -p murmur-bindgen -- --check
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libclang-dev
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &core-cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/sherpa-rs
            target
          key: cargo-core-v3-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-core-v3-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Create the deps directory sherpa-rs-sys copies its native libraries into
        run: mkdir -p target/debug/deps
      - run: cargo clippy -p murmur-core -p murmur-bindgen --all-targets --locked -- -D warnings
      - run: cargo test -p murmur-core --locked
      - if: env.SAVE_CACHE == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *core-cache-paths
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  mac:
    name: macOS app (build and bundle)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &mac-cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/Library/Caches/sherpa-rs
            target
          key: cargo-mac-v3-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-mac-v3-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - run: apps/murmur/scripts/build-mac.sh
      - name: Check the bundle
        run: |
          app=apps/murmur/build/Murmur.app
          test -x "$app/Contents/MacOS/Murmur"
          codesign --verify --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          for lproj in "$app"/Contents/Resources/*.lproj; do plutil -lint "$lproj"/*.strings; done
          ! otool -L "$app"/Contents/Frameworks/*.dylib "$app/Contents/MacOS/Murmur" \
            | grep -E '^\s+/(Users|opt|private|var)/'
      - if: env.SAVE_CACHE == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *mac-cache-paths
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  darwin-sdk:
    name: Darwin SDK from the runner's Xcode (xtool)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    outputs:
      swift-version: ${{ steps.xcode.outputs.swift-version }}
    steps:
      - name: Find Xcode and its Swift version
        id: xcode
        run: |
          xcode="$(dirname "$(dirname "$(xcode-select -p)")")"
          swift_version="$(xcrun swift --version 2>&1 | sed -nE 's/.*Apple Swift version ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p')"
          echo "Xcode: $xcode, Swift $swift_version"
          echo "path=$xcode" >> "$GITHUB_OUTPUT"
          echo "swift-version=$swift_version" >> "$GITHUB_OUTPUT"
      - run: brew install xtool-org/tap/xtool
      - run: xtool sdk build "${{ steps.xcode.outputs.path }}" "$RUNNER_TEMP/sdk" --arch x86_64
      - run: tar --zstd -cf "$RUNNER_TEMP/darwin.xtoolsdk.tar.zst" -C "$RUNNER_TEMP/sdk" darwin.xtoolsdk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-sdk
          path: ${{ runner.temp }}/darwin.xtoolsdk.tar.zst
          retention-days: 1
          compression-level: 0

  linux-cross:
    name: macOS app cross-built on Linux (xtool)
    needs: darwin-sdk
    runs-on: ubuntu-latest
    container: swift:${{ needs.darwin-sdk.outputs.swift-version }}-noble
    env:
      APPLE_CODESIGN_RELEASE: "0.29.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git zstd cmake make llvm libclang-dev
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" toolchain install
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/xtool-org/xtool/releases/latest/download/xtool-x86_64.AppImage" -o /usr/local/bin/xtool
          chmod +x /usr/local/bin/xtool
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${APPLE_CODESIGN_RELEASE}/apple-codesign-${APPLE_CODESIGN_RELEASE}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin --wildcards '*/rcodesign'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-sdk
          path: /tmp
      - name: Install the Darwin SDK
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          tar --zstd -xf /tmp/darwin.xtoolsdk.tar.zst -C /tmp
          xtool sdk install /tmp/darwin.xtoolsdk
          swift sdk list
      - name: Build Murmur.app
        run: apps/murmur/scripts/build-mac.sh
      - run: tar -cf /tmp/murmur-linux-cross.tar -C apps/murmur/build Murmur.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: murmur-linux-cross
          path: /tmp/murmur-linux-cross.tar
          retention-days: 7

  verify-linux-cross:
    name: Verify the Linux-built app on macOS
    needs: linux-cross
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: murmur-linux-cross
      - run: tar -xf murmur-linux-cross.tar
      - name: Check signature, architecture and linkage
        run: |
          codesign --verify --strict --deep --verbose=2 Murmur.app
          lipo -archs Murmur.app/Contents/MacOS/Murmur | grep -qx arm64
          ! otool -L Murmur.app/Contents/Frameworks/*.dylib Murmur.app/Contents/MacOS/Murmur \
            | grep -E '^\s+/(root|home|__w|github|tmp)/'
      - name: Launch it
        run: |
          set +e
          perl -e 'alarm 10; exec @ARGV' Murmur.app/Contents/MacOS/Murmur
          code=$?
          echo "exit code: $code"
          test "$code" -eq 142

  delete-darwin-sdk:
    name: Delete the SDK artifact
    needs: [darwin-sdk, linux-cross]
    if: always() && needs.darwin-sdk.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "darwin-sdk") | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
