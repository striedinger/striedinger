packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  onnxruntime-node: false
  protobufjs: false
  sharp: true

overrides:
  onnxruntime-common: 1.31.1
  onnxruntime-web: 1.31.1

verifyDepsBeforeRun: warn

minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - tsrs@0.20.1-ts7.1.0-beta
