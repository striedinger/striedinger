[workspace]
resolver = "2"
# Every Rust crate lives in crates/.
members = ["crates/*", "packages/pkmn-tcg-dex-core", "packages/pkmn-tcg-dex-sqlite", "apps/pkmn-tcg-dex"]

[profile.release]
opt-level = 3
lto = "thin"
debug = false

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
pkmn-tcg-dex-core = { path = "packages/pkmn-tcg-dex-core" }
pkmn-tcg-dex-sqlite = { path = "packages/pkmn-tcg-dex-sqlite" }
